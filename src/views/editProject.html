<div class="container">
    <div id="loading">
        <div class="loader"></div>
        <h2 data-i18n="loading">Loading...</h2>
    </div>
    <div id="admin-controls" class="hide"></div>
    <div id="edit-section" class="">
        <div class="language-tabs">
            <button type="button" id="tab-lang-en" class="tab-btn active">English</button>
            <button type="button" id="tab-lang-es" class="tab-btn">Español</button>
        </div>
        <div id="project-details">
            <input type="text" placeholder="Project Title" name="project-title-input" id="project-title-input"
                data-i18n="[placeholder]project_title_placeholder" />
            <div id="toggles">
                <div>
                    <span id="current-status-label">Current Project</span>
                    <label class="switch">
                        <input type="checkbox" id="project-status-toggle" class="toggle-input" checked>
                        <span class="slider round"></span>
                    </label>

                </div>
                <div>
                    <span id="published-label" data-i18n="unpublished">Unpublished</span>
                    <label class="switch">
                        <input type="checkbox" id="published-toggle" class="toggle-input">
                        <span class="slider round"></span>
                    </label>

                </div>
            </div>
        </div>
        <div id="editor-container" style="height: 300px;"></div>
        <div class="actions">
            <button id="delete-btn" class="delete-button">
                <span class="material-symbols-outlined">delete</span>
                <span data-i18n="delete_project">Delete Project</span>
            </button>
            <button id="save-btn" class="accent-button">
                <span class="material-symbols-outlined">save</span>
                <span data-i18n="save_project">Save Project</span>
            </button>
        </div>
    </div>
</div>
