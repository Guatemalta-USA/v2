<div class="container">
    <div id="loading">
        <div class="loader"></div>
        <h2 data-i18n="loading">Loading...</h2>
    </div>
    <div id="admin-controls" class="hide"></div>
    <div id="edit-section" class="hide">
        <div class="language-tabs">
            <button type="button" id="tab-lang-en" class="tab-btn active">English</button>
            <button type="button" id="tab-lang-es" class="tab-btn">Español</button>
        </div>
        <div id="project-details">
            <input type="text" placeholder="Page Name" name="page-name-input" id="page-name-input" />
        </div>
        <div id="editor-container" style="height: 300px;"></div>
        <div class="actions">
            <button id="delete-btn" class="delete-button" style="display: none;">
                <span class="material-symbols-outlined">delete</span>
                <span>Delete Page</span>
            </button>
            <button id="save-btn" class="accent-button">
                <span class="material-symbols-outlined">save</span>
                <span>Save Page</span>
            </button>
        </div>
    </div>
</div>
